// Plain Java, no Minecraft on the classpath: anything here compiles once and serves every version.
plugins {
	id "java-library"
}

group = project.maven_group
version = project.mod_version

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 8
}

// The commit the mod is built at, for the relays to be at the same one (see RelayHub).
def commit = providers.exec { commandLine "git", "rev-parse", "HEAD" }.standardOutput.asText.map { it.trim() }

processResources {
	inputs.property "commit", commit
	def out = destinationDir
	doLast {
		new File(out, "mapmcbot-commit.txt").text = commit.get()
	}
}
